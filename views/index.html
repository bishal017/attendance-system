<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Students</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 48px 40px;
      border-radius: 16px;
      text-align: center;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .icon { font-size: 40px; margin-bottom: 12px; }

    h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .subtitle b { color: #2c5364; }

    .file-area {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
      position: relative;
    }

    .file-area:hover { border-color: #1abc9c; background: #f0fdf9; }

    .file-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-area-text { font-size: 14px; color: #888; pointer-events: none; }
    .file-area-text span { display: block; font-size: 24px; margin-bottom: 6px; }

    #fileName {
      font-size: 13px;
      color: #1abc9c;
      font-weight: 600;
      margin-top: 6px;
      min-height: 18px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #1abc9c;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button[type="submit"]:hover { background: #16a085; transform: translateY(-1px); }
    button[type="submit"]:active { transform: translateY(0); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #ccc;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }

    .link {
      display: inline-block;
      color: #1abc9c;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: color 0.2s;
    }
    .link:hover { color: #16a085; text-decoration: underline; }

    .note {
      font-size: 11px;
      color: #aaa;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<div class="card">
  <div class="icon">📂</div>
  <h2>Upload Student Data</h2>
  <p class="subtitle">
    Excel must have columns:<br>
    <b>Admission No, Name, Email, Preference</b>
  </p>

  <form action="/upload" method="post" enctype="multipart/form-data">
    <div class="file-area">
      <input type="file" name="file" accept=".xlsx,.xls" required
             onchange="document.getElementById('fileName').innerText = this.files[0]?.name || ''"/>
      <div class="file-area-text">
        <span>📎</span>
        Click to browse or drag & drop
      </div>
      <div id="fileName"></div>
    </div>

    <button type="submit">Upload Students</button>
  </form>

  <p class="note">⚠ QR codes must be pre-generated using Admission No</p>

  <div class="divider">or</div>

  <a href="/scan" class="link">➡ Go to Scanner</a>
</div>
</body>
</html>
