<!DOCTYPE html>
<html>
<head>
  <title>Upload Students</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #1abc9c, #2c3e50);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      width: 350px;
      box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 10px;
      color: #2c3e50;
    }

    p {
      font-size: 14px;
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    button {
      padding: 12px 25px;
      background: #1abc9c;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #16a085;
    }

    .link {
      margin-top: 20px;
      display: block;
      color: #1abc9c;
      text-decoration: none;
      font-weight: bold;
    }

    .link:hover {
      text-decoration: underline;
    }

    .note {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>📂 Upload Student Data</h2>

  <p>Upload Excel file with <b>Admission No, Name, Email</b></p>

  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <br>
    <button type="submit">Upload Students</button>
  </form>

  <div class="note">
    ⚠ QR codes should already be created separately using Admission No
  </div>

  <a href="/scan" class="link">➡ Go to Scanner</a>
</div>

</body>
</html>
