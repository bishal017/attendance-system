<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6f9;
    }

    h2 {
      text-align: center;
    }
    /* for flush */
    .flash-success {
      background-color: #d4edda !important;
      transition: 0.3s;
    } 

    .flash-error {
      background-color: #f8d7da !important;
      transition: 0.3s;
    }

    .tabs {
      display: flex;
      justify-content: center;
      background: #2c3e50;
    }

    .tab {
      padding: 15px 25px;
      color: white;
      cursor: pointer;
    }

    .tab:hover {
      background: #34495e;
    }

    .active {
      background: #1abc9c;
    }

    .content {
      display: none;
      padding: 20px;
      text-align: center;
    }

    .show {
      display: block;
    }

    #reader {
      margin: auto;
      width: 320px;
    }

    input {
      padding: 10px;
      width: 200px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      background: #1abc9c;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #16a085;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 70%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    th {
      background: #1abc9c;
      color: white;
    }

    #resultBox {
      margin-top: 15px;
      font-weight: bold;
    }

    hr {
      border: none;
      height: 1px;
      background: #ccc;
      margin: 20px;
    }
  </style>
</head>

<body>
<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<h2>📋 Attendance System</h2>

<div class="tabs">
  <div class="tab active" onclick="openTab('scan')">📷 Scan + Manual</div>
  <div class="tab" onclick="openTab('attendance')">📊 Attendance</div>
</div>

<!-- SCAN + MANUAL -->
<div id="scan" class="content show">
  <h3>Scan QR Code</h3>
  <div id="reader"></div>

  <hr>

  <h3>Or Enter Manually</h3>
  <input id="manualInput" placeholder="Enter Admission No">
  <br>
  <button onclick="manualSubmit()">Submit</button>

  <div id="resultBox"></div>
</div>

<!-- ATTENDANCE -->
<div id="attendance" class="content">
  <h3>Attendance List</h3>
  <h4 id="countBox">Total Present: 0</h4>
  <button onclick="loadAttendance()">Refresh</button>
  <br><br>
  <table id="attTable">
    <tr>
      <th>#</th>
      <th>Admission No</th>
      <th>Name</th>
      <th>Preference</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  </table>
</div>

<script>

/* TAB SWITCH */
function openTab(tabName) {
  document.querySelectorAll(".content").forEach(c => c.classList.remove("show"));
  document.getElementById(tabName).classList.add("show");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");

  // 🔥 AUTO LOAD
  if (tabName === "attendance") {
    loadAttendance();
  }
}

/* SCANNER */
let lastScan = "";

function onScanSuccess(decodedText) {
  const admNo = decodedText.trim().toLowerCase();

  if (admNo === lastScan) return;

  lastScan = admNo;

  sendAttendance(admNo);

  setTimeout(() => {
    lastScan = "";
  }, 2000);
}

const scanner = new Html5QrcodeScanner("reader", {
  fps: 15,
  qrbox: { width: 250, height: 250 }
});

scanner.render(onScanSuccess);

/* MANUAL */
function manualSubmit() {
  const input = document.getElementById("manualInput").value.trim().toLowerCase();

  if (!input) {
    showResult("Enter Admission No ❌", false);
    return;
  }

  sendAttendance(input);
}

/* SEND ATTENDANCE */
async function sendAttendance(admNo) {

  showResult("Processing... ⏳", null);

  const res = await fetch("/attendance", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ admNo })
  });

  const data = await res.json();

  if (data.message.includes("✅")) {
    showResult(data.message, true);
  } else {
    showResult(data.message, false);
  }

  // 🔥 AUTO REFRESH ATTENDANCE TABLE
  loadAttendance();

  // clear manual input
  document.getElementById("manualInput").value = "";
}

/* RESULT DISPLAY */
function showResult(msg, success) {
  const box = document.getElementById("resultBox");

  box.innerText = msg;

  // RESET COLORS
  document.body.classList.remove("flash-success", "flash-error");

  if (success === true) {
    box.style.color = "green";

    // 🔊 Beep
    // document.getElementById("beepSound").play();
    

    // 📱 Vibrate
    if (navigator.vibrate) navigator.vibrate(200);

    // 🟢 Flash
    document.body.classList.add("flash-success");

  } else if (success === false) {
    box.style.color = "red";

    // 🔴 Flash
    document.body.classList.add("flash-error");

  } else {
    box.style.color = "black";
  }

  // remove flash after 1 sec
  setTimeout(() => {
    document.body.classList.remove("flash-success", "flash-error");
  }, 1000);
}

/* LOAD ATTENDANCE */
async function loadAttendance() {
  const res = await fetch("/attendance-list");
  const data = await res.json();

  const table = document.getElementById("attTable");
  document.getElementById("countBox").innerText =
  "Total Present: " + data.length;
  table.innerHTML = `
    <tr>
      <th>#</th>
      <th>Admission No</th>
      <th>Name</th>
      <th>Preference</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  `;

  data.forEach((item, index) => {
    table.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${item.admNo}</td>
        <td>${item.name}</td>
        <td>${item.preference}</td>
        <td>${item.date}</td>
        <td>
          <button onclick="deleteAttendance('${item._id}')">❌</button>
        </td>
      </tr>
    `;
  });
}

/* DELETE */
async function deleteAttendance(id) {
  if (!confirm("Are you sure?")) return;

  await fetch(`/delete-attendance/${id}`, {
    method: "DELETE"
  });

  showResult("Deleted ✅", true);
  loadAttendance();
}

</script>

</body>
</html>
